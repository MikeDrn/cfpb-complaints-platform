name: cfpb-platform

x-platform: &platform
  build:
    context: .
    dockerfile: docker/platform.Dockerfile
  image: cfpb-platform:1.0
  env_file: .env
  volumes:
    - ./:/app
    - ivy_cache:/root/.ivy2          # caches the Spark S3A jars between runs
  depends_on:
    minio:
      condition: service_started
    mongo:
      condition: service_healthy

services:
  minio:
    # MinIO deleted minio/minio from Docker Hub (Sept 2026); Chainguard publishes a free build.
    image: cgr.dev/chainguard/minio:latest
    user: "0"                         # image runs as uid 65532 by default; root avoids volume permission errors
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "1.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  nifi:
    image: apache/nifi:1.28.1
    environment:
      NIFI_WEB_HTTP_PORT: "8080"      # plain HTTP for local classroom use
      NIFI_JVM_HEAP_INIT: "1g"
      NIFI_JVM_HEAP_MAX: "2g"
    ports: ["8080:8080"]
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      minio:
        condition: service_started

  init:                               # one-shot: creates the MinIO buckets, then exits
    <<: *platform
    command: ["python", "-m", "ingestion.storage", "init"]
    restart: "no"

  collector:                          # small API that NiFi will call on a schedule
    <<: *platform
    command: ["uvicorn", "ingestion.service:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped

  dashboard:
    <<: *platform
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--server.headless=true"]
    ports: ["8501:8501"]
    restart: unless-stopped

  jobs:                               # used with: docker compose run --rm jobs <command>
    <<: *platform
    profiles: ["jobs"]
    command: ["python", "-c", "print('Usage: docker compose run --rm jobs <command>')"]

volumes:
  minio_data:
  mongo_data:
  ivy_cache:
  nifi_conf:
  nifi_state:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance: